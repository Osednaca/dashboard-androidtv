providers = ["php", "node"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
NODE_ENV = "production"

[phases.install]
cmds = [
    "composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader",
    "npm ci --no-audit --no-fund"
]

[phases.build]
cmds = ["npm run build"]
